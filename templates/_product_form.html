<form method="post" action="{{ action }}" id="prodForm">
  <label class="form-label mb-0">Item name</label>
  <input class="form-control mb-2" name="name" placeholder="e.g. Rice 25kg bag" value="{{ item.name if item }}" required>
  <div class="row g-2">
    <div class="col-6"><label class="form-label mb-0">Buying price (each)</label>
      <input class="form-control pcalc" name="buy" type="number" step="any" min="0" value="{{ item.buy|num if item }}" required></div>
    <div class="col-6"><label class="form-label mb-0">Selling price (each)</label>
      <input class="form-control pcalc" name="sell" type="number" step="any" min="0" value="{{ item.sell|num if item }}" required></div>
  </div>
  <div id="pprev" class="alert alert-light border mt-3 mb-2 py-2">Enter both prices to see the profit per unit.</div>
  <button class="btn btn-success w-100">{{ label }}</button>
</form>
<script>
(function () {
  const f = document.getElementById("prodForm"), p = document.getElementById("pprev");
  function show() {
    if (!f.buy.value || !f.sell.value) return;
    const d = parseFloat(f.sell.value) - parseFloat(f.buy.value), m = parseFloat(f.buy.value) ? (d / parseFloat(f.buy.value) * 100).toFixed(1) : "0";
    p.className = "alert mt-3 mb-2 py-2 alert-" + (d > 0 ? "success" : d < 0 ? "danger" : "secondary");
    p.innerHTML = "<b>" + (d > 0 ? "Profit" : d < 0 ? "Loss" : "Break-even") + " per unit: " + CUR + Math.abs(d).toLocaleString() + "</b> (" + m + "% markup)";
  }
  f.querySelectorAll(".pcalc").forEach(i => i.addEventListener("input", show)); show();
})();
</script>
