<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{background:#f4f6f5}.navbar{background:#0b5345}</style>
</head>
<body>
<nav class="navbar navbar-dark"><div class="container">
  <a class="navbar-brand" href="{{ url_for('index') }}">🧮 {{ name }}</a>
  <div class="dropdown">
    <button class="btn btn-outline-light btn-sm dropdown-toggle" data-bs-toggle="dropdown">⬇ Export</button>
    <ul class="dropdown-menu dropdown-menu-end">
      <li><a class="dropdown-item" href="{{ url_for('export', fmt='xlsx') }}">📗 Excel (.xlsx)</a></li>
      <li><a class="dropdown-item" href="{{ url_for('export', fmt='pdf') }}">📕 PDF (.pdf)</a></li>
      <li><a class="dropdown-item" href="{{ url_for('export', fmt='docx') }}">📘 Word (.docx)</a></li>
      <li><a class="dropdown-item" href="{{ url_for('export', fmt='csv') }}">📄 CSV (.csv)</a></li>
    </ul></div>
</div></nav>
<main class="container py-3">
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
  <div class="alert alert-{{ cat }} alert-dismissible fade show">{{ msg }}<button class="btn-close" data-bs-dismiss="alert"></button></div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Two-tap delete (browser pop-ups like confirm() do not work inside the Android app): tap once -> "Sure?", tap again -> delete.
document.addEventListener("click", e => {
  const b = e.target.closest(".js-del"); if (!b || b.dataset.armed) return;
  e.preventDefault(); b.dataset.armed = "1"; const t = b.textContent;
  b.textContent = "Sure?"; b.classList.replace("btn-outline-danger", "btn-danger");
  setTimeout(() => { delete b.dataset.armed; b.textContent = t; b.classList.replace("btn-danger", "btn-outline-danger"); }, 3000);
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
