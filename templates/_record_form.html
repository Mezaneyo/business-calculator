<form method="post" action="{{ action }}" id="recForm">
  <label class="form-label mb-0">Select item</label>
  <select class="form-select mb-2" name="product_id" required>
    <option value="">Choose an item...</option>
    {% for p in products %}<option value="{{ p.id }}" data-buy="{{ p.buy }}" data-sell="{{ p.sell }}" {{ 'selected' if rec and rec.product_id == p.id }}>{{ p.name }}</option>{% endfor %}
  </select>
  <div class="row g-2">
    <div class="col-6"><label class="form-label mb-0">Quantity bought</label>
      <input class="form-control rcalc" name="bought" type="number" step="any" min="0.01" value="{{ rec.bought|num if rec }}" required></div>
    <div class="col-6"><label class="form-label mb-0">Quantity sold</label>
      <input class="form-control rcalc" name="sold" type="number" step="any" min="0" placeholder="blank = all sold" value="{{ rec.sold|num if rec }}"></div>
    <div class="col-12"><label class="form-label mb-0">Extra costs (MK)</label>
      <input class="form-control rcalc" name="extra" type="number" step="any" min="0" placeholder="transport, packaging" value="{{ rec.extra|num if rec and rec.extra }}"></div>
  </div>
  <div id="rprev" class="alert alert-light border mt-3 mb-2 py-2">Select an item and enter the quantities to see the result.</div>
  <button class="btn btn-success w-100" {{ 'disabled' if not products }}>{{ label }}</button>
  {% if not products %}<div class="text-warning small mt-1">Add an item in step 1 first.</div>{% endif %}
</form>
<script>
(function () {
  const f = document.getElementById("recForm"), p = document.getElementById("rprev"), m = x => "MK" + Math.abs(x).toLocaleString();
  function show() {
    const o = f.product_id.selectedOptions[0];
    if (!o || !o.value || !f.bought.value) return;
    const buy = +o.dataset.buy, sell = +o.dataset.sell, bought = +f.bought.value, sold = f.sold.value === "" ? bought : +f.sold.value, extra = +f.extra.value || 0;
    if (sold > bought) { p.className = "alert alert-warning mt-3 mb-2 py-2"; p.textContent = "Quantity sold cannot be more than quantity bought."; return; }
    const rev = sold * sell, cost = bought * buy + extra, profit = rev - cost, unsold = bought - sold;
    p.className = "alert mt-3 mb-2 py-2 alert-" + (profit > 0 ? "success" : profit < 0 ? "danger" : "secondary");
    p.innerHTML = "<b>" + (profit > 0 ? "Profit" : profit < 0 ? "Loss" : "Break-even") + ": " + m(profit) + "</b><br><small>Sales " + m(rev) + " − Cost " + m(cost) +
      (unsold > 0 ? "<br>Unsold: " + unsold + " units (worth " + m(unsold * sell) + ")" : "") + "</small>";
  }
  f.querySelectorAll(".rcalc, select").forEach(i => i.addEventListener("input", show)); show();
})();
</script>
